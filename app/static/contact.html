<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - AgroSmart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/modern_agro.css">
</head>
<body class="page-body">
    <div id="navbar-container"></div>

    <section class="py-5">
        <div class="container animate-slide-up">
            <!-- Sección de Gestión Avanzada: Soporte Prioritario y Videollamadas -->
            <div id="advanced-support-container" class="mb-5 mx-auto" style="max-width: 800px;"></div>

            <div class="p-5 rounded-4 mx-auto shadow-sm" style="max-width: 700px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9);">
                <div class="text-center mb-4">
                    <span class="badge bg-primary-soft text-primary px-3 py-1 rounded-pill mb-2 fw-bold text-uppercase" style="font-size: 0.75rem;">Mesa de Ayuda AgroSmart</span>
                    <h2 class="fw-800 text-dark mb-1">Formulario de Contacto</h2>
                    <p class="text-muted small">Envía tu consulta o solicitud al equipo de atención al cliente</p>
                </div>
                <form id="contact-form">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted text-uppercase">Nombre Completo</label>
                        <input type="text" id="contact_name" class="form-control" style="padding: 12px 16px; border-radius: 12px;" required placeholder="Escribe tu nombre">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted text-uppercase">Correo Electrónico</label>
                        <input type="email" id="contact_email" class="form-control" style="padding: 12px 16px; border-radius: 12px;" required placeholder="Tu correo electrónico">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted text-uppercase">Asunto de Consulta</label>
                        <input type="text" id="contact_subject" class="form-control" style="padding: 12px 16px; border-radius: 12px;" required placeholder="Motivo de contacto">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Mensaje</label>
                        <textarea id="contact_message" rows="5" class="form-control" style="padding: 12px 16px; border-radius: 12px;" required placeholder="Escribe tu mensaje o detalle del problema aquí..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm" style="background: linear-gradient(135deg, #10b981, #059669); border: none;">Enviar Mensaje a Mesa de Ayuda</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-light py-4 border-top mt-5">
        <div class="container text-center">
            <div class="d-flex flex-wrap justify-content-center gap-3 mb-2 small">
                <a href="index.html" class="text-muted text-decoration-none">Inicio</a> &bull;
                <a href="privacy.html" class="text-muted text-decoration-none">Política de Privacidad</a> &bull;
                <a href="data-deletion.html" class="text-muted text-decoration-none">Eliminación de Datos</a> &bull;
                <a href="terms.html" class="text-muted text-decoration-none">Términos de Servicio</a> &bull;
                <a href="soporte.html" class="text-muted text-decoration-none">Soporte</a>
            </div>
            <p class="text-muted small m-0">&copy; 2026 AgroSmart - El Futuro del Campo. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/notification-service.js"></script>
    <script src="js/layout.js"></script>
    <script>
        async function initContact() {
            if (window.initLayout) await window.initLayout('contact');
            
            // Initialize EmailJS as fallback
            if (typeof emailjs !== 'undefined' && window.CONFIG && window.CONFIG.EMAILJS_PUBLIC_KEY) {
                emailjs.init(window.CONFIG.EMAILJS_PUBLIC_KEY);
            }

            const user = await AuthObj.getCurrentUser();
            const emailInput = document.getElementById('contact_email');
            const subjectInput = document.getElementById('contact_subject');
            const advContainer = document.getElementById('advanced-support-container');
            
            // Renderizado dinámico de la sección de Gestión Avanzada (Videollamada)
            if (advContainer) {
                let hasVideoAccess = false;
                if (user && user.id !== 'guest' && !user._isStub) {
                    if (user.is_superuser || ['global_owner', 'ministry_admin'].includes(user.role)) {
                        hasVideoAccess = true;
                    } else {
                        const currentPlan = (user.plan || 'none').toLowerCase();
                        hasVideoAccess = ['diamante', 'esmeralda'].includes(currentPlan);
                        if (!hasVideoAccess && user.country_id && window.DB) {
                            try {
                                const countries = await window.DB.getCountries();
                                const userCountry = countries.find(c => String(c.id) === String(user.country_id));
                                if (userCountry && ['diamante', 'esmeralda'].includes((userCountry.plan || '').toLowerCase())) {
                                    hasVideoAccess = true;
                                }
                            } catch(err) { console.warn("Silent fallback country check:", err); }
                        }
                    }
                }

                if (hasVideoAccess) {
                    advContainer.innerHTML = `
                        <div class="p-4 rounded-4 text-white shadow-lg" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border: 1px solid rgba(139, 92, 246, 0.4);">
                            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="fs-1 text-warning" style="filter: drop-shadow(0 0 15px rgba(245,158,11,0.5));">⭐</div>
                                    <div>
                                        <div class="badge bg-primary px-3 py-1 mb-1 text-uppercase fw-bold" style="letter-spacing: 0.5px; font-size: 0.7rem;">Soporte Prioritario Habilitado</div>
                                        <h4 class="fw-800 mb-1 text-white">Gestión Avanzada por Videollamada</h4>
                                        <p class="text-white-50 small mb-0">Atención técnica satelital en tiempo real con apertura de fichas de reporte y seguimiento.</p>
                                    </div>
                                </div>
                                <div>
                                    <a href="calls.html" class="btn px-4 py-3 rounded-pill fw-bold shadow-sm d-flex align-items-center gap-2 text-white" style="background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; transition: transform 0.2s;">
                                        <i class="bi bi-camera-video-fill fs-5"></i>
                                        <span>Iniciar Gestión Avanzada</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    advContainer.innerHTML = `
                        <div class="p-4 rounded-4 shadow-sm" style="background: linear-gradient(135deg, rgba(139, 92, 246, 0.06) 0%, rgba(16, 185, 129, 0.04) 100%); border: 1px dashed rgba(139, 92, 246, 0.4);">
                            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="fs-1 text-primary"><i class="bi bi-shield-lock-fill"></i></div>
                                    <div>
                                        <h5 class="fw-bold mb-1 text-dark">Gestión Avanzada por Videollamada</h5>
                                        <p class="text-muted small mb-0">El soporte prioritario satelital y la generación de fichas en vivo es exclusivo de las licencias <strong class="text-primary">Diamante</strong> y <strong class="text-success">Esmeralda</strong>.</p>
                                    </div>
                                </div>
                                <div>
                                    <a href="services.html" class="btn btn-outline-primary px-4 py-2 rounded-pill fw-bold small">
                                        <i class="bi bi-gem me-1"></i> Ver Planes de Licencia
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            // Auto-rellenar y bloquear el correo si el usuario está registrado
            if (user && user.id !== 'guest' && !user._isStub && emailInput) {
                emailInput.value = user.email;
                emailInput.setAttribute('readonly', 'readonly');
            } else if (emailInput) {
                emailInput.value = '';
                emailInput.removeAttribute('readonly');
            }

            // Capturar asunto de la URL (si viene de services.html)
            const urlParams = new URLSearchParams(window.location.search);
            const prefilledSubject = urlParams.get('subject');
            if (prefilledSubject && subjectInput) {
                subjectInput.value = prefilledSubject;
            }
            
            const contactForm = document.getElementById('contact-form');
            if (contactForm) {
                contactForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const name = document.getElementById('contact_name').value;
                    const email = document.getElementById('contact_email').value;
                    const subject = document.getElementById('contact_subject').value;
                    const message = document.getElementById('contact_message').value;
                    const submitBtn = contactForm.querySelector('button[type="submit"]');

                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Enviando...';
                    
                    try {
                        // Primary: NotificationService (n8n webhook)
                        const result = await window.NotificationService.sendContactForm({
                            name: name,
                            email: email,
                            subject: subject,
                            message: message
                        });
                        
                        Swal.fire({
                            icon: 'success',
                            title: 'Mensaje Enviado',
                            text: 'Tu mensaje fue enviado exitosamente a AgroSmart. Nos pondremos en contacto contigo pronto.',
                            confirmButtonColor: '#10b981'
                        });
                        
                        contactForm.reset();
                        // Restaurar el email si es usuario logueado
                        if (user && user.id !== 'guest' && !user._isStub && emailInput) {
                            emailInput.value = user.email;
                        }
                    } catch (error) {
                        console.warn("Contact send warning:", error);
                        Swal.fire({
                            icon: 'error',
                            title: 'Error de envío',
                            text: 'Hubo un problema al enviar tu mensaje. Por favor intenta más tarde.',
                            confirmButtonColor: '#10b981'
                        });
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Enviar mensaje';
                    }
                });
            }
        }
        document.addEventListener('DOMContentLoaded', initContact);
    </script>
</body>
</html>
